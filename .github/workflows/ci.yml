name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply schema.sql
        run: psql postgresql://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 -f server/schema.sql
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install server
        run: pip install -e "./server[dev]"
      - name: Run tests
        working-directory: server
        # Exit code 5 means no tests were collected yet.
        run: pytest || [ $? -eq 5 ]
      - name: Install simulator
        run: pip install -e ./sim
      - name: Run simulator tests
        working-directory: sim
        run: pytest

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: echo "exists=$([ -f mobile/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.check.outputs.exists == 'true'
        working-directory: mobile
        run: npm ci && npm test --if-present

  cpp:
    # Every test and the shared vectors with each crypto backend (cpp/README.md):
    # OpenSSL 3, and the portable one (p256-m) that the WebAssembly build uses.
    name: cpp (${{ matrix.crypto }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crypto: [openssl, portable]
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL 3 headers
        if: matrix.crypto == 'openssl'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Configure (Debug, ASan + UBSan, warnings as errors)
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Debug -DSTORMCASH_SANITIZE=ON -DSTORMCASH_WERROR=ON -DSTORMCASH_CRYPTO=${{ matrix.crypto }}
      - name: Build
        run: cmake --build cpp/build -j 4
      - name: Unit tests
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir cpp/build --output-on-failure
      - name: Shared vectors (spec/vectors.json)
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: cpp/build/verify/stormcash-verify vectors spec/vectors.json --strict
      - name: Release build (optimizer-only warnings, as errors)
        run: |
          cmake -S cpp -B cpp/build-release -DCMAKE_BUILD_TYPE=Release -DSTORMCASH_WERROR=ON -DSTORMCASH_BUILD_TESTS=OFF -DSTORMCASH_CRYPTO=${{ matrix.crypto }}
          cmake --build cpp/build-release -j 4
          cpp/build-release/verify/stormcash-verify vectors spec/vectors.json --strict
          cpp/build-release/scale/stormcash-scale run --residents 10000 --replicates 4

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: echo "exists=$([ -f dashboard/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.check.outputs.exists == 'true'
        working-directory: dashboard
        run: npm ci && npm test --if-present && npm run build
